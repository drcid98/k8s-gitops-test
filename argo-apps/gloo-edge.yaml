apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gloo-edge
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gloo-system
  sources:
  - repoURL: https://storage.googleapis.com/solo-public-helm
    chart: gloo
    targetRevision: 1.20.4
    helm:
      values: |
        gloo:
          gateway:
            enabled: true
        gateway:
          service:
            type: NodePort
          validation: 
            enabled: false
        discovery:
          enabled: true
        kubeResourceRollout:
          enabled: false
        kubeResourceMigration:
          enabled: false

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
