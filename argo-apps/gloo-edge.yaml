apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gloo-edge
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gloo-system
  sources:
  - repoURL: https://storage.googleapis.com/solo-public-helm
    chart: gloo
    targetRevision: 1.20.4
    helm:
      values: |
        gloo:
          gateway:
            enabled: true
        gateway:
          service:
            type: NodePort
        kubeResourceRollout:
          enabled: false
        kubeResourceMigration:
          enabled: false
        gatewayProxies:
          gatewayProxy:
            podTemplate:
              volumes:
                - name: tmp
                  emptyDir: {}
              containers:
                envoy:
                  volumeMounts:
                    - name: tmp
                      mountPath: /tmp
  - repoURL: https://github.com/drcid98/k8s-gitops-test.git
    targetRevision: main
    path: gloo-edge

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
