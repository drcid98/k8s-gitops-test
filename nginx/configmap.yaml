apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      # Lists files in the mounted PVC at /test
      location /test {
        alias /usr/share/nginx/html/demo/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        index index.html;
      }

      # Lists files in a second mounted PVC at /test2
      location /test2 {
        alias /;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        index index.html;
      }
    }

  custom-entrypoint.sh: |
    #!/bin/sh
    set -e

    DATA_DIRS="/usr/share/nginx/html/demo /"

    # Generates an index.html for each configured data directory.
    generate_index_for() {
      dir="$1"
      index_file="${dir}/index.html"
      mkdir -p "${dir}"

      files=$(ls -1 "${dir}" 2>/dev/null | grep -v '^index\.html$' || true)

      if [ -z "${files}" ]; then
        cat > "${index_file}" <<'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <title>Demo Volume</title>
          </head>
          <body>
            <h1>Demo Volume</h1>
            <p>No files in the mounted volume.</p>
          </body>
        </html>
    EOF
      else
        {
          echo "<!DOCTYPE html>"
          echo "<html><head><title>Demo Volume</title></head><body>"
          echo "<h1>Files in the mounted volume</h1><ul>"
          for f in ${files}; do
            esc=$(printf '%s\n' "${f}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            echo "<li><a href=\"${esc}\">${esc}</a></li>"
          done
          echo "</ul></body></html>"
        } > "${index_file}"
      fi
    }

    generate_index() {
      for dir in ${DATA_DIRS}; do
        generate_index_for "${dir}"
      done
    }

    generate_index
    # Refresh the listing periodically so changes show up without a restart.
    while true; do
      sleep 5
      generate_index
    done &

    exec nginx -g "daemon off;"

