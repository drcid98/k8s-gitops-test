apiVersion: gateway.solo.io/v1
kind: VirtualService
metadata:
  name: python-http
  namespace: gloo-system
spec:
  sslConfig:
    secretRef:
      name: python-http-tls
      namespace: gloo-system
    sniDomains:
      - python-http.test.local
  virtualHost:
    domains:
      - python-http.test.local
    routes:
      - matchers:
          - prefix: /
        routeAction:
          single:
            upstream:
              name: default-python-http-80
              namespace: gloo-system
